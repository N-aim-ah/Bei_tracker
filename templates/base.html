<!DOCTYPE html>
<html>
<head>
    <title>BeiTracker</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            width: 220px;
            height: 100vh;
            position: fixed;
            background: #111827;
            color: white;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            margin: 12px 0;
        }

        .sidebar a:hover {
            color: white;
        }

        .main {
            margin-left: 240px;
            padding: 20px;
        }

        .card {
            border-radius: 14px;
            border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .topbar {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h4>📊 BeiTracker</h4>

    <a href="{% url 'home' %}">🏠 Home</a>
    <a href="{% url 'map' %}">📍 Map</a>

    {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}">📦 Dashboard</a>
        <a href="{% url 'logout' %}">🚪 Logout</a>
    {% else %}
        <a href="{% url 'login' %}">🔑 Login</a>
        <a href="{% url 'register' %}">📝 Register</a>
    {% endif %}
</div>

<div class="main">

    <div class="topbar">
        <h5>Welcome, {{ user.username|default:"Guest" }}</h5>
    </div>

    {% block content %}{% endblock %}

</div>

</body>
</html>
