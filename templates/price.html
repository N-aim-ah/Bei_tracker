{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow-lg border-0" style="border-radius: 14px;">
                <div class="card-body p-4">

                    <h3 class="mb-3"> Add Product Price</h3>

                    <p class="text-muted">
                        Add your product prices manually. No selection needed.
                    </p>

                    {% if error %}
                        <div class="alert alert-danger">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <!-- ITEM NAME (NEW SYSTEM) -->
                        <div class="mb-3">
                            <label class="form-label">Item Name</label>
                            <input type="text" name="item_name" class="form-control"
                                   placeholder="Type your item e.g Rice, Milk" required>
                        </div>

                        <!-- PRICE -->
                        <div class="mb-3">
                            <label class="form-label">Amount (Ksh)</label>
                            <input type="number" name="amount" class="form-control"
                                   placeholder="e.g. 120" required>
                        </div>

                        <!-- IMAGE -->
                        <div class="mb-3">
                            <label class="form-label">Product Image (optional)</label>
                            <input type="file" name="image" class="form-control">
                        </div>

                        <!-- INFO BOX -->
                        <div class="alert alert-info">
                             Your shop location is automatically linked.<br>
                             You are adding products to your personal shop account only.
                        </div>

                        <!-- SUBMIT BUTTON -->
                        <button type="submit" class="btn btn-primary w-100">
                             Save Price
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
