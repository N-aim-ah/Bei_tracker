{% extends "base.html" %}
{% block content %}

<div class="card p-4">

    <h4>💬 Chat with {{ shop.name }}</h4>

    <div style="height:350px; overflow-y:auto; background:#f9fafb; padding:10px; border-radius:10px;">
        {% for msg in messages %}
            <div style="margin-bottom:10px;">
                <b>{{ msg.sender.username }}</b>:
                <span>{{ msg.content }}</span>
            </div>
        {% endfor %}
    </div>

    <form method="POST" class="mt-3">
        {% csrf_token %}
        <input class="form-control" name="message" placeholder="Ask: Mchele iko?">
        <button class="btn btn-dark mt-2 w-100">Send</button>
    </form>

</div>

{% endblock %}
