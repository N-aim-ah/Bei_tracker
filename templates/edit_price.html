{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

    <div class="card shadow p-4">

        <h4 class="mb-3">✏️ Edit Product</h4>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <label>Item Name</label>
            <input type="text" name="item_name" class="form-control mb-3"
                   value="{{ price.item_name }}" required>

            <label>Amount</label>
            <input type="number" name="amount" class="form-control mb-3"
                   value="{{ price.amount }}" required>

            <label>Image</label>
            <input type="file" name="image" class="form-control mb-3">

            {% if price.image %}
                <img src="{{ price.image.url }}" width="120" class="mb-3">
            {% endif %}

            <button class="btn btn-primary">Update</button>

        </form>

    </div>

</div>

{% endblock %}
